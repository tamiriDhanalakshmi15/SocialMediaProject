{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Create Post</title>
    <link rel="stylesheet" href="{% static 'socialapp/style.css' %}">
</head>

<body>

<h1>Create a Post</h1>

<div>

    <form method="POST">
        {% csrf_token %}

        <textarea
            name="content"
            placeholder="What's on your mind?"
            rows="6"
            required
        ></textarea>

        <br><br>

        <button type="submit">Post</button>
    </form>

    <br>

    <a href="{% url 'home' %}">
        Back to Home
    </a>

</div>

</body>
</html>
